<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="description" content="رابطي — صفحة روابط ومتجر منتجات رقمية. أنشئ متجرك، بِع منتجاتك، وتابع طلباتك من لوحة تحكم واحدة.">
  <title>رابطي — لوحة التحكم</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app-boot" style="min-height:100dvh;display:grid;place-items:center;background:#f5f6f8;font-family:Cairo,system-ui,sans-serif;color:#667085;gap:12px;text-align:center;padding:20px">
    <div style="width:30px;height:30px;border-radius:50%;border:3px solid #e4e7ec;border-top-color:#0d9488;animation:spin 1s linear infinite"></div>
    <div style="font-size:13px">جارٍ تحميل رابطي…</div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  </div>
  <noscript><div style="padding:40px;text-align:center;font-family:Cairo,sans-serif">يحتاج رابطي إلى JavaScript. فعّله ثم أعد تحميل الصفحة.</div></noscript>
  <script src="config.js"></script>
  <script src="supabase.min.js"></script>
  <script type="module" src="app.js"></script>
  <script src="app-update.js" defer></script>

</html>
